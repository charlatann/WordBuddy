# 使用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: WordBuddy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  WordBuddy:
    type: application
    platform: iOS
    sources:
      - path: WordBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wordbuddy
        PRODUCT_NAME: WordBuddy
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 单词伙伴
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 需要使用麦克风录下你的跟读，用于回放和发音打分。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 需要使用语音识别来分析你的发音并打分。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  WordBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WordBuddyTests
    dependencies:
      - target: WordBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wordbuddy.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
  WordBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WordBuddyUITests
    dependencies:
      - target: WordBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wordbuddy.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: WordBuddy
schemes:
  WordBuddy:
    build:
      targets:
        WordBuddy: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - WordBuddy
      targets:
        - WordBuddyTests
        - WordBuddyUITests
